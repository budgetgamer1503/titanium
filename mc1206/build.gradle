plugins {
    id 'java-library'
}

dependencies {
    implementation project(':common')
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'net.fabricmc:fabric-loader:0.15.11'
}

jar {
    archiveBaseName = 'Titanium-mc1.20.6'
    from {
        project(':common').sourceSets.main.output
    }
}
